version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: researchos-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OPERATING_MODE=FREE_ONLY
      - FREE_ONLY=true
      - MAX_SPEND_AUD=0.0
      - DEFAULT_COUNTRY=AU
      - DEFAULT_CURRENCY=AUD
      - DEFAULT_TIMEZONE=Australia/Brisbane
      - DATABASE_URL=sqlite+aiosqlite:///data/researchos.db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: researchos-scheduler
    restart: unless-stopped
    command: python -m researchos.apps.scheduler.scheduler
    environment:
      - OPERATING_MODE=FREE_ONLY
      - FREE_ONLY=true
      - DATABASE_URL=sqlite+aiosqlite:///data/researchos.db
    volumes:
      - ./data:/app/data
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    container_name: researchos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: researchos-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage